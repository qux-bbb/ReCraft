# cargo-deny configuration.
#
# Rule of thumb: every dependency must be compatible with AGPL-3.0-only, the project's
# only license. That rules out GPL-2.0-only (incompatible with AGPL-3.0) and GPL-3.0-only
# (the project keeps the option of relicensing its own code later; see ADR-013).

[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]

[advisories]
yanked = "warn"

[licenses]
confidence-threshold = 0.9
# Every entry below must be compatible with AGPL-3.0-only. `AGPL-3.0-only` itself is listed
# because cargo-deny also checks the workspace crates, not just registry dependencies.
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    # Non-permissive but AGPL-3.0-only compatible, pulled in transitively. Without these the
    # `licenses` job fails on the graphical stack (see NOTICE.md for the component list):
    #   BSL-1.0                arboard -> clipboard-win / error-code (desktop clipboard)
    #   CDLA-Permissive-2.0    ureq -> webpki-roots (bundled CA roots)
    #   OFL-1.1, Ubuntu-font-1.0  epaint_default_fonts (fallback glyphs; embedded as a subset)
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
