[package]
name = "recraft-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
recraft-common = { workspace = true }
recraft-app = { workspace = true }
recraft-core = { workspace = true }
eframe = { version = "0.36.2", features = ["glow"] }
egui = "0.36.2"
rfd = "0.17.2"
egui_dock = { version = "0.21.1", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.154"
recraft-decompile.workspace = true
recraft-analysis.workspace = true
recraft-ai = { version = "0.1.0", path = "../recraft-ai" }

[dev-dependencies]
tempfile = "3.27.0"
