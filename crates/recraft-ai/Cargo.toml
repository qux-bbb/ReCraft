[package]
name = "recraft-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
recraft-common = { workspace = true }
recraft-core = { workspace = true }
recraft-analysis = { workspace = true }
recraft-decompile = { version = "0.1.0", path = "../recraft-decompile" }
recraft-query = { workspace = true }
serde_json = "1.0.154"
ureq = "3.5.0"
base64 = "0.23.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
tempfile = "3.27.0"
