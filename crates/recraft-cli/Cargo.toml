[package]
name = "recraft-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "recraft-cli"
path = "src/main.rs"

[dependencies]
recraft-common = { workspace = true }
recraft-app = { workspace = true }
recraft-core = { workspace = true }
recraft-format = { workspace = true }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
recraft-decompile.workspace = true
recraft-analysis.workspace = true
recraft-mcp = { path = "../recraft-mcp" }
recraft-ai = { path = "../recraft-ai" }
tempfile = "3.27.0"
