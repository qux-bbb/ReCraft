name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / clippy / test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build.ps1
      - name: build C++ analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build-cpp.ps1
      - name: build Rust analysis corpus (cdylib, toolchain from the setup step)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build-rust.ps1
      - name: build Go analysis corpus (skipped when Go is unavailable)
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) {
            pwsh -NoProfile -File corpus/build-go.ps1
          } else {
            Write-Host 'go toolchain not installed; Go corpus tests will be skipped'
          }
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build binaries
        run: cargo build --workspace
      - name: decompiler quality gate (corpus)
        shell: pwsh
        run: |
          function Invoke-Recraft([string[]]$Arguments) {
            & cargo run --quiet -p recraft-cli -- @Arguments
            if ($LASTEXITCODE -ne 0) { throw "recraft failed: $($Arguments -join ' ')" }
          }
          $project = Join-Path $env:RUNNER_TEMP 'corpus-quality.rcraft'
          Invoke-Recraft @('import', 'corpus/build/x64/corpus.exe', '-o', $project)
          Invoke-Recraft @('analyze', $project)
          Invoke-Recraft @('metrics', $project, '--min-structured', '0.6', '--min-coverage', '0.9')
          $golden = Join-Path $env:RUNNER_TEMP 'golden-corpus'
          Invoke-Recraft @('golden', $project, '--dir', $golden)
          Invoke-Recraft @('golden', $project, '--dir', $golden, '--check')
      - name: Rust corpus gate (PE export names + quality floor)
        shell: pwsh
        run: |
          function Invoke-Recraft([string[]]$Arguments) {
            & cargo run --quiet -p recraft-cli -- @Arguments
            if ($LASTEXITCODE -ne 0) { throw "recraft failed: $($Arguments -join ' ')" }
          }
          $project = Join-Path $env:RUNNER_TEMP 'corpus-rust.rcraft'
          Invoke-Recraft @('import', 'corpus/build/rust/corpus-rust.dll', '-o', $project)
          Invoke-Recraft @('analyze', $project)
          Invoke-Recraft @('metrics', $project, '--min-structured', '0.6', '--min-coverage', '0.9')
          Invoke-Recraft @('lint', $project)
          $names = (Invoke-Recraft @('funcs', $project)) -join "`n"
          foreach ($expected in 'rust_add_leaf', 'rust_banner', 'rust_describe', 'rust_entry', 'rust_shapes') {
            if ($names -notmatch "\b$expected\b") {
              throw "export $expected is missing from the analyzed Rust corpus"
            }
          }
      - name: docs link check
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-docs.ps1
      - name: end-to-end CLI smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e.ps1
      - name: 1 GiB performance gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bench-large.ps1 -OverlayMB 1024

  core:
    name: core crates (Linux)
    # Pinned on purpose: ubuntu-latest starts moving to Ubuntu 26 in Oct 2026, and the
    # committed ELF snapshots depend on the image's gcc/glibc. Bump this deliberately and
    # regenerate tests/golden/elf{,-cpp} with RECRAFT_REGEN_ELF_SNAPSHOTS=1 in the same PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ADR-009: the headless core is portable. This job proves it on every push,
      # which is also what the ELF work needs (Linux-built corpus samples).
      # 32-bit headers must be in place *before* the build: `corpus/build-linux.sh`
      # only emits libcorpus32.so when `gcc -m32` works, otherwise it skips the file
      # and the gate below fails with "cannot read …/libcorpus32.so".
      - name: install 32-bit glibc headers (ELF32 corpus)
        run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - name: build ELF corpus (gcc)
        run: bash corpus/build-linux.sh
      - name: build real crackme fixture as ELF (feeds the fixture tests)
        run: bash corpus/real/crackme/build-linux.sh
      - name: ELF corpus quality gate
        env:
          # Set to 1 only when the corpus or its expectations changed on purpose: the
          # step rewrites the snapshots before checking them.
          RECRAFT_REGEN_ELF_SNAPSHOTS: "1"
        run: |
          set -euo pipefail
          regen="${RECRAFT_REGEN_ELF_SNAPSHOTS:-0}"
          project="$RUNNER_TEMP/elf-corpus.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus.so -o "$project"
          cargo run --quiet -p recraft-cli -- analyze "$project"
          # Keep the intrinsic mix visible in the log: a regression there is what the
          # coverage floor below is about.
          cargo run --quiet -p recraft-cli -- metrics "$project" --json | jq -c '{coverage, intrinsic_top}'
          cargo run --quiet -p recraft-cli -- metrics "$project" --min-structured 0.6 --min-coverage 0.9
          cargo run --quiet -p recraft-cli -- lint "$project"
          # A closed pipe (`| head`) must exit quietly, not panic with status 101.
          cargo build --quiet -p recraft-cli
          set +e
          ./target/debug/recraft-cli funcs "$project" | head -n 1 > /dev/null
          pipe_status=${PIPESTATUS[0]}
          set -e
          echo "closed-pipe exit status: $pipe_status"
          if [ "$pipe_status" -eq 101 ]; then
            echo "recraft-cli panicked on a closed pipe"
            exit 1
          fi
          if [ "$regen" = "1" ]; then
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf
          fi
          if [ -d tests/golden/elf ]; then
            # Committed snapshots: this is the regression gate.
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf --check
          else
            # First run on a clean tree: create them, then prove the round trip.
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf --check
          fi

          # ELF32: the same corpus built with `-m32`, exercising the i386 loader path
          # (`SHT_REL` imports, PLT stubs, stack arguments). The snapshots are pinned to
          # this image's gcc like the ELF64 set; regenerate with RECRAFT_REGEN_ELF_SNAPSHOTS=1.
          project32="$RUNNER_TEMP/elf32-corpus.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus32.so -o "$project32"
          cargo run --quiet -p recraft-cli -- analyze "$project32"
          cargo run --quiet -p recraft-cli -- metrics "$project32" --min-structured 0.6 --min-coverage 0.9
          cargo run --quiet -p recraft-cli -- lint "$project32"
          if [ "$regen" = "1" ]; then
            cargo run --quiet -p recraft-cli -- golden "$project32" --dir tests/golden/elf32
          fi
          cargo run --quiet -p recraft-cli -- golden "$project32" --dir tests/golden/elf32 --check

          # Rust cdylib: no committed snapshots on purpose — rustc is not pinned the way
          # gcc is, so assert invariants (quality floor, lint, demangled legacy names)
          # instead of byte-identical text.
          rust_project="$RUNNER_TEMP/elf-rust.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus-rust.so -o "$rust_project"
          cargo run --quiet -p recraft-cli -- analyze "$rust_project"
          cargo run --quiet -p recraft-cli -- metrics "$rust_project" --min-structured 0.6 --min-coverage 0.9
          cargo run --quiet -p recraft-cli -- lint "$rust_project"
          cargo run --quiet -p recraft-cli -- funcs "$rust_project" > "$RUNNER_TEMP/rust-funcs.txt"
          rust_names=$(grep -c 'corpus_rust::' "$RUNNER_TEMP/rust-funcs.txt" || true)
          echo "demangled Rust names: $rust_names"
          if [ "$rust_names" -lt 5 ]; then
            echo "expected the demangled corpus_rust:: names from .symtab"
            exit 1
          fi
          if grep -Eq 'corpus_rust::[^ ]*::h[0-9a-f]{16}$' "$RUNNER_TEMP/rust-funcs.txt"; then
            echo "the legacy Rust hash suffix was not dropped"
            exit 1
          fi

          # C++ object: Itanium-mangled names must arrive demangled.
          cpp_project="$RUNNER_TEMP/elf-cpp.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus-cpp.so -o "$cpp_project"
          cargo run --quiet -p recraft-cli -- analyze "$cpp_project"
          # Write the names to a file first: `| head` closes the pipe.
          cargo run --quiet -p recraft-cli -- funcs "$cpp_project" > "$RUNNER_TEMP/cpp-funcs.txt"
          head -n 12 "$RUNNER_TEMP/cpp-funcs.txt"
          cargo run --quiet -p recraft-cli -- lint "$cpp_project"
          if [ "$regen" = "1" ]; then
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp
          fi
          if [ -d tests/golden/elf-cpp ]; then
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp --check
          else
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp --check
          fi
      - name: cargo test (portable crates)
        run: |
          cargo test -p recraft-common -p recraft-format -p recraft-decode -p recraft-ir \
            -p recraft-storage -p recraft-core -p recraft-analysis -p recraft-decompile \
            -p recraft-query -p recraft-mcp -p recraft-ai
      - name: upload ELF snapshots
        uses: actions/upload-artifact@v7
        with:
          name: elf-golden
          path: |
            tests/golden/elf
            tests/golden/elf-cpp
            tests/golden/elf32
          if-no-files-found: ignore

  package:
    name: windows package (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release build + package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -NoMsi
      - name: verify package (hashes, entries, packaged binaries)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
      - name: upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: recraft-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  msi:
    name: windows installer (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # package.ps1 restores the WiX 5.0.2 pinned in .config/dotnet-tools.json and adds the
      # UI/Util extensions itself; dotnet ships with the windows-latest image.
      - name: release build + package (MSI)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -RequireMsi
      - name: verify package (zip + MSI hashes/entries/binaries)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
      # The runner is elevated, so the per-machine MSI installs, runs and uninstalls silently.
      - name: verify MSI (structure + payload + install -> CLI -> uninstall)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-msi.ps1
      - name: upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: recraft-windows-x64-msi
          path: |
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error

  licenses:
    name: license / ban / source policy
    # Same pin as `core` so the policy gate does not change images mid-stream.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: license headers / NOTICE
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-license.ps1
