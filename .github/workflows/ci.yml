name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / clippy / test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build.ps1
      - name: build C++ analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build-cpp.ps1
      - name: build Go analysis corpus (skipped when Go is unavailable)
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) {
            pwsh -NoProfile -File corpus/build-go.ps1
          } else {
            Write-Host 'go toolchain not installed; Go corpus tests will be skipped'
          }
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build binaries
        run: cargo build --workspace
      - name: decompiler quality gate (corpus)
        shell: pwsh
        run: |
          function Invoke-Recraft([string[]]$Arguments) {
            & cargo run --quiet -p recraft-cli -- @Arguments
            if ($LASTEXITCODE -ne 0) { throw "recraft failed: $($Arguments -join ' ')" }
          }
          $project = Join-Path $env:RUNNER_TEMP 'corpus-quality.rcraft'
          Invoke-Recraft @('import', 'corpus/build/x64/corpus.exe', '-o', $project)
          Invoke-Recraft @('analyze', $project)
          Invoke-Recraft @('metrics', $project, '--min-structured', '0.6', '--min-coverage', '0.9')
          $golden = Join-Path $env:RUNNER_TEMP 'golden-corpus'
          Invoke-Recraft @('golden', $project, '--dir', $golden)
          Invoke-Recraft @('golden', $project, '--dir', $golden, '--check')
      - name: end-to-end CLI smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e.ps1
      - name: 1 GiB performance gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bench-large.ps1 -OverlayMB 1024
      - name: AI cache/audit smoke (local mock provider)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ai-cache-smoke.ps1

  package:
    name: windows package (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release build + package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -NoInstaller
      - name: upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: recraft-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  licenses:
    name: license / ban / source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
