name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / clippy / test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build.ps1
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build binaries
        run: cargo build --workspace
      - name: end-to-end CLI smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e.ps1

  licenses:
    name: license / ban / source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
