name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: build / clippy / test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: build analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build.ps1
      - name: build C++ analysis corpus (MSVC, CRT-free)
        shell: pwsh
        run: pwsh -NoProfile -File corpus/build-cpp.ps1
      - name: build Go analysis corpus (skipped when Go is unavailable)
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) {
            pwsh -NoProfile -File corpus/build-go.ps1
          } else {
            Write-Host 'go toolchain not installed; Go corpus tests will be skipped'
          }
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build binaries
        run: cargo build --workspace
      - name: decompiler quality gate (corpus)
        shell: pwsh
        run: |
          function Invoke-Recraft([string[]]$Arguments) {
            & cargo run --quiet -p recraft-cli -- @Arguments
            if ($LASTEXITCODE -ne 0) { throw "recraft failed: $($Arguments -join ' ')" }
          }
          $project = Join-Path $env:RUNNER_TEMP 'corpus-quality.rcraft'
          Invoke-Recraft @('import', 'corpus/build/x64/corpus.exe', '-o', $project)
          Invoke-Recraft @('analyze', $project)
          Invoke-Recraft @('metrics', $project, '--min-structured', '0.6', '--min-coverage', '0.9')
          $golden = Join-Path $env:RUNNER_TEMP 'golden-corpus'
          Invoke-Recraft @('golden', $project, '--dir', $golden)
          Invoke-Recraft @('golden', $project, '--dir', $golden, '--check')
      - name: docs link check
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-docs.ps1
      - name: end-to-end CLI smoke
        shell: pwsh
        run: pwsh -NoProfile -File scripts/e2e.ps1
      - name: 1 GiB performance gate
        shell: pwsh
        run: pwsh -NoProfile -File scripts/bench-large.ps1 -OverlayMB 1024
      - name: AI cache/audit smoke (local mock provider)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ai-cache-smoke.ps1

  core:
    name: core crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ADR-009: the headless core is portable. This job proves it on every push,
      # which is also what the ELF work needs (Linux-built corpus samples).
      - name: build ELF corpus (gcc)
        run: bash corpus/build-linux.sh
      - name: cargo test (portable crates)
        run: |
          cargo test -p recraft-common -p recraft-format -p recraft-decode -p recraft-ir \
            -p recraft-storage -p recraft-core -p recraft-analysis -p recraft-decompile \
            -p recraft-query -p recraft-mcp -p recraft-ai
      - name: ELF corpus quality gate
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/elf-corpus.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus.so -o "$project"
          cargo run --quiet -p recraft-cli -- analyze "$project"
          # Keep the intrinsic mix visible in the log: a regression there is what the
          # coverage floor below is about.
          cargo run --quiet -p recraft-cli -- metrics "$project" --json | jq -c '{coverage, intrinsic_top}'
          cargo run --quiet -p recraft-cli -- metrics "$project" --min-structured 0.6 --min-coverage 0.9
          cargo run --quiet -p recraft-cli -- lint "$project"
          if [ -d tests/golden/elf ]; then
            # Committed snapshots: this is the regression gate.
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf --check
          else
            # First run on a clean tree: create them, then prove the round trip.
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf
            cargo run --quiet -p recraft-cli -- golden "$project" --dir tests/golden/elf --check
          fi

          # C++ object: Itanium-mangled names must arrive demangled.
          cpp_project="$RUNNER_TEMP/elf-cpp.rcraft"
          cargo run --quiet -p recraft-cli -- import corpus/build/linux/libcorpus-cpp.so -o "$cpp_project"
          cargo run --quiet -p recraft-cli -- analyze "$cpp_project"
          cargo run --quiet -p recraft-cli -- funcs "$cpp_project" | head -n 12
          cargo run --quiet -p recraft-cli -- lint "$cpp_project"
          if [ -d tests/golden/elf-cpp ]; then
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp --check
          else
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp
            cargo run --quiet -p recraft-cli -- golden "$cpp_project" --dir tests/golden/elf-cpp --check
          fi
      - name: upload ELF snapshots
        uses: actions/upload-artifact@v4
        with:
          name: elf-golden
          path: |
            tests/golden/elf
            tests/golden/elf-cpp
          if-no-files-found: ignore

  package:
    name: windows package (zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release build + package
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -NoMsi
      - name: verify package (hashes, entries, packaged binaries)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
      - name: upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: recraft-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  msi:
    name: windows installer (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # package.ps1 restores the WiX 5.0.2 pinned in .config/dotnet-tools.json and adds the
      # UI/Util extensions itself; dotnet ships with the windows-latest image.
      - name: release build + package (MSI)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/package.ps1 -RequireMsi
      - name: verify package (zip + MSI hashes/entries/binaries)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-package.ps1
      # The runner is elevated, so the per-machine MSI installs, runs and uninstalls silently.
      - name: verify MSI (structure + payload + install -> CLI -> uninstall)
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-msi.ps1
      - name: upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: recraft-windows-x64-msi
          path: |
            dist/*.msi
            dist/SHA256SUMS.txt
          if-no-files-found: error

  licenses:
    name: license / ban / source policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
      - name: license headers / NOTICE
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-license.ps1
